name: Compliance CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    - name: Install Markdownlint
      run: npm install -g markdownlint-cli
    - name: Run Markdownlint
      run: markdownlint '**/*.md'
