name: Compliance Engine CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # Native Node.js environment provisioning
    - name: Setup Node.js Runtime
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Verify Vital Infrastructure Layout
      run: |
        test -f README.md || exit 1
        test -f publisher-suite/adsense-global-audit-skill.md || exit 1
        test -f publisher-suite/adsense-updates.txt || exit 1

    - name: Execute Markdown Format Verification
      run: |
        npm install -g markdownlint-cli
        markdownlint "**/*.md" --disable MD013 || echo "Minor formatting warning caught."

  # NEW ADVANCED AUTOMATED LIGHTHOUSE INTEGRATION STAGE
  lighthouse-performance-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # Spin up an automated headless Chrome testing environment to trace layout scripts
    - name: Run Lighthouse CLS and Core Web Vitals Audit
      uses: treosh/lighthouse-ci-action@v11
      with:
        urls: |
          https://github.io
        budgetPath: ./budgets.json # Optional structural load configurations
        uploadArtifacts: true # Safely maps out performance charts to your GitHub dashboard
